<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线购物网站 - 销售人员管理</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo"><h1>在线购物网站 - 管理员</h1></div>
            <div class="nav-links">
                <a href="admin.html">产品管理</a>
                <a href="admin-orders.html">订单管理</a>
                <a href="admin-reports.html">销售报表</a>
                <a href="admin-sales.html" class="active">销售人员</a>
                <a href="javascript:void(0)" id="logoutBtn">退出登录</a>
            </div>
        </nav>
    </header>
    <main>
        <div class="admin-container">
            <h2>销售人员 ID 管理</h2>
            <form id="addSalesForm" class="inline-form">
                <input type="text" id="salesName" placeholder="姓名" required>
                <input type="email" id="salesEmail" placeholder="邮箱账号" required>
                <input type="password" id="salesPassword" placeholder="初始密码" required>
                <input type="text" id="salesPhone" placeholder="电话">
                <button type="submit">添加销售人员</button>
            </form>
            <div id="salesUsersContainer" class="table-container"></div>
        </div>
        <div class="admin-container">
            <h2>管理者操作日志</h2>
            <div id="operationLogsContainer" class="table-container"></div>
        </div>
    </main>
    <script src="js/i18n.js"></script>
    <script src="js/common.js"></script>
    <script src="js/admin-sales.js"></script>
</body>
</html>
